name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Pearl Link 1.0.0
          body: |
            Client-side Fabric mod for Minecraft 26.2
            - /pearl link <player>
            - Keybind (default G) triggers the other player to right-click a trapdoor
          files: |
            build/libs/*.jar
          draft: false
          prerelease: false
